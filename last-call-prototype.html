<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Call — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14101F; --ink2:#1D1730; --ink3:#2A2142; --line:#372C52;
  --amber:#E8A33D; --amber-hot:#FFC061; --magenta:#FF4D8D;
  --teal:#3DD9B0; --violet:#8B7BFF; --paper:#F5EFE6;
  --dim:#9C92AE; --dim2:#6E6484;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#0A0810; font-family:'Archivo',system-ui,sans-serif; color:var(--paper);
  display:flex;align-items:center;justify-content:center; padding:24px 12px;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%, rgba(232,163,61,.10), transparent 60%),
                   radial-gradient(ellipse 60% 40% at 90% 110%, rgba(255,77,141,.08), transparent 60%);
}
.phone{
  width:100%;max-width:400px;height:min(880px,calc(100vh - 48px));
  background:var(--ink);border:1px solid var(--line);border-radius:32px;
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  box-shadow:0 40px 80px -20px rgba(0,0,0,.8);
}

header{padding:20px 20px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(232,163,61,.07), transparent);flex-shrink:0}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim2);display:flex;justify-content:space-between}
.live{color:var(--magenta);display:flex;align-items:center;gap:5px}
.live.closed{color:var(--dim2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--magenta);animation:pulse 2s infinite}
.live.closed .dot{background:var(--dim2);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
h1{font-family:'Anton',sans-serif;font-size:34px;letter-spacing:.02em;line-height:1;margin:8px 0 12px;text-transform:uppercase}
.totals{display:flex;gap:20px;align-items:baseline}
.tot-big{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;color:var(--amber)}
.tot-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
.tot-sub{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--dim)}

nav{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
nav button{flex:1;background:none;border:none;cursor:pointer;padding:13px 0;
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim2);border-bottom:2px solid transparent;transition:.18s}
nav button[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber)}
nav button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}

main{flex:1;overflow-y:auto;overscroll-behavior:contain}
main::-webkit-scrollbar{width:0}
.pane{display:none;padding:18px 20px 120px}
.pane.on{display:block}

/* stops + expenses */
.stop{margin-bottom:26px}
.stop-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stop-idx{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink);background:var(--amber);
  width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:600;flex-shrink:0}
.stop-name{font-family:'Anton',sans-serif;font-size:17px;letter-spacing:.02em;text-transform:uppercase}
.stop-time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim2);margin-left:auto}

.exp{background:var(--ink2);border:1px solid var(--ink3);border-radius:12px;padding:12px 13px;
  margin-bottom:8px;display:flex;gap:11px;align-items:center;cursor:pointer;
  animation:slidein .3s ease both;transition:border-color .15s}
.exp:hover{border-color:var(--line)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--ink)}
.exp-mid{flex:1;min-width:0}
.exp-note{font-size:13px;font-weight:600;line-height:1.3}
.exp-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim2);margin-top:3px}
.exp-amt{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;text-align:right}
.exp-split{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim2);text-align:right;margin-top:2px}
.flag{background:none;border:none;cursor:pointer;color:var(--dim2);font-size:14px;padding:2px 4px;transition:color .15s}
.flag:hover,.flag.on{color:var(--magenta)}
.exp.disputed{border-color:rgba(255,77,141,.45);background:rgba(255,77,141,.06)}
.pending-bar{height:2px;background:var(--ink3);border-radius:2px;margin-top:7px;overflow:hidden}
.pending-fill{height:100%;background:var(--amber);animation:fill 12s linear forwards}
@keyframes fill{from{width:0}to{width:100%}}

.tapline{display:flex;align-items:center;gap:8px;padding:7px 0 15px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim2)}
.tapline .bar{flex:1;height:1px;background:var(--line)}
.tapline.out{color:var(--magenta)}
.tapline.in{color:var(--teal)}

/* last call button */
.lastcall{
  width:100%;margin-top:8px;border:none;border-radius:16px;padding:20px;cursor:pointer;
  background:linear-gradient(135deg,var(--magenta),#D6336C);color:#fff;
  font-family:'Anton',sans-serif;font-size:20px;letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 10px 30px -8px rgba(255,77,141,.55);transition:transform .12s}
.lastcall:active{transform:scale(.98)}
.lastcall small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.1em;opacity:.85;margin-top:5px;font-weight:400}

/* crew */
.prow{padding:14px 0;border-bottom:1px solid var(--ink3)}
.prow:last-child{border:none}
.ptop{display:flex;align-items:center;gap:12px}
.pname{flex:1;font-size:14px;font-weight:600}
.ptag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  border-radius:4px;padding:2px 5px;margin-left:6px}
.tag-dry{color:var(--teal);border:1px solid rgba(61,217,176,.4)}
.tag-gone{color:var(--magenta);border:1px solid rgba(255,77,141,.4)}
.pspend{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;text-align:right}
.pnet{font-family:'IBM Plex Mono',monospace;font-size:10px;text-align:right;margin-top:2px}
.pos{color:var(--teal)}.neg{color:var(--magenta)}
.track{height:6px;background:var(--ink3);border-radius:3px;margin:11px 0 8px;position:relative;overflow:hidden}
.track .span{position:absolute;top:0;bottom:0;border-radius:3px;opacity:.85}
.pmeta{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;color:var(--dim2)}
.pbtns{display:flex;gap:6px;margin-top:9px}
.mini-btn{background:none;border:1px solid var(--line);color:var(--dim2);border-radius:6px;
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.07em;padding:6px 9px;
  cursor:pointer;transition:.15s;text-transform:uppercase}
.mini-btn.on{border-color:var(--teal);color:var(--teal);background:rgba(61,217,176,.1)}
.mini-btn.warn.on{border-color:var(--magenta);color:var(--magenta);background:rgba(255,77,141,.1)}

.section-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim2);margin:6px 0 6px}
.note-box{background:var(--ink2);border:1px solid var(--ink3);border-radius:10px;padding:11px 12px;
  font-size:11.5px;line-height:1.55;color:var(--dim);margin-bottom:16px}

/* receipt */
.receipt{background:var(--paper);color:#1A1520;font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;line-height:1.65;padding:22px 20px 26px;position:relative;
  filter:drop-shadow(0 14px 26px rgba(0,0,0,.5));animation:print .7s cubic-bezier(.2,.8,.2,1) both;
  clip-path:polygon(0 8px,4% 0,8% 8px,12% 0,16% 8px,20% 0,24% 8px,28% 0,32% 8px,36% 0,40% 8px,44% 0,48% 8px,52% 0,56% 8px,60% 0,64% 8px,68% 0,72% 8px,76% 0,80% 8px,84% 0,88% 8px,92% 0,96% 8px,100% 0,100% calc(100% - 8px),96% 100%,92% calc(100% - 8px),88% 100%,84% calc(100% - 8px),80% 100%,76% calc(100% - 8px),72% 100%,68% calc(100% - 8px),64% 100%,60% calc(100% - 8px),56% 100%,52% calc(100% - 8px),48% 100%,44% calc(100% - 8px),40% 100%,36% calc(100% - 8px),32% 100%,28% calc(100% - 8px),24% 100%,20% calc(100% - 8px),16% 100%,12% calc(100% - 8px),8% 100%,4% calc(100% - 8px),0 100%)}
@keyframes print{from{opacity:0;transform:translateY(-24px) scaleY(.9);transform-origin:top}to{opacity:1;transform:none}}
.r-center{text-align:center}
.r-title{font-family:'Anton',sans-serif;font-size:22px;letter-spacing:.06em;margin:4px 0 2px}
.r-rule{border-top:1px dashed #1A1520;opacity:.45;margin:10px 0}
.r-line{display:flex;justify-content:space-between;gap:10px}
.r-line span:last-child{white-space:nowrap}
.r-muted{opacity:.6}
.r-pay{display:flex;justify-content:space-between;gap:8px;padding:7px 0;
  border-bottom:1px dotted rgba(26,21,32,.3);animation:stamp .4s ease both}
@keyframes stamp{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.r-big{font-family:'Anton',sans-serif;font-size:15px;letter-spacing:.03em}
.r-stat{display:flex;justify-content:space-between;font-size:10.5px;opacity:.75}
.venmo{display:block;width:100%;margin-top:9px;background:#1A1520;color:var(--paper);border:none;
  border-radius:6px;padding:9px;cursor:pointer;font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.venmo:hover{background:#332A42}
.settled{opacity:.4}
.preview-tag{background:rgba(232,163,61,.14);border:1px solid rgba(232,163,61,.45);color:var(--amber-hot);
  border-radius:8px;padding:9px 11px;margin-bottom:14px;font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.06em;line-height:1.5}

/* fab + sheet */
.fab{position:absolute;left:20px;right:20px;bottom:20px;z-index:20;display:flex;gap:10px}
.fab button{flex:1;border:none;cursor:pointer;border-radius:14px;padding:15px 0;
  font-family:'Anton',sans-serif;font-size:15px;letter-spacing:.06em;text-transform:uppercase;transition:transform .12s}
.fab button:active{transform:scale(.97)}
.fab-main{background:var(--amber);color:var(--ink);box-shadow:0 8px 24px -6px rgba(232,163,61,.5)}
.fab-alt{flex:0 0 62px !important;background:var(--ink2);color:var(--paper);border:1px solid var(--line) !important}

.scrim{position:absolute;inset:0;background:rgba(6,4,12,.75);backdrop-filter:blur(3px);z-index:30;display:none}
.scrim.on{display:block;animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:var(--ink2);
  border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 20px 22px;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:90%;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 16px}
.sheet h2{font-family:'Anton',sans-serif;font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px}
.sheet .hint{font-size:11px;color:var(--dim2);margin-bottom:16px;line-height:1.5}

.amount-display{font-family:'IBM Plex Mono',monospace;font-size:36px;font-weight:600;
  text-align:center;color:var(--amber);padding:6px 0 4px}
.tip-row{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.chip{background:var(--ink3);border:1px solid transparent;color:var(--dim);cursor:pointer;
  border-radius:20px;padding:6px 11px;font-family:'IBM Plex Mono',monospace;font-size:10px;transition:.15s}
.chip.on{background:rgba(232,163,61,.16);border-color:var(--amber);color:var(--amber-hot)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pad button{background:var(--ink3);border:none;color:var(--paper);border-radius:12px;padding:16px 0;
  font-family:'IBM Plex Mono',monospace;font-size:19px;cursor:pointer;transition:background .12s}
.pad button:active{background:var(--line)}

.who{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.who button{border:1px solid var(--line);background:var(--ink3);color:var(--dim2);cursor:pointer;
  border-radius:20px;padding:7px 12px 7px 8px;display:flex;align-items:center;gap:7px;
  font-size:12px;font-weight:600;transition:.15s}
.who button.on{background:rgba(245,239,230,.09);color:var(--paper)}
.who button.away{opacity:.35;border-style:dashed}
.who .mini{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:600;color:var(--ink);opacity:.35;transition:opacity .15s}
.who button.on .mini{opacity:1}
.who-actions{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.link{background:none;border:none;color:var(--amber);cursor:pointer;font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 0}
.auto-note{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--dim2);
  line-height:1.5;margin-bottom:14px}

.shares{background:var(--ink);border:1px solid var(--ink3);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.shrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.shrow .nm{flex:1;font-size:12px;font-weight:600}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--ink3);
  color:var(--paper);cursor:pointer;font-size:14px;line-height:1}
.stepper span{font-family:'IBM Plex Mono',monospace;font-size:12px;width:30px;text-align:center;color:var(--amber)}
.shrow .amt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim2);width:52px;text-align:right}

.confirm{width:100%;border:none;border-radius:14px;padding:16px;cursor:pointer;background:var(--amber);
  color:var(--ink);font-family:'Anton',sans-serif;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.confirm:disabled{background:var(--ink3);color:var(--dim2);cursor:not-allowed}
.danger{width:100%;background:none;border:1px solid rgba(255,77,141,.4);color:var(--magenta);
  border-radius:12px;padding:12px;cursor:pointer;margin-top:9px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.cancel{width:100%;background:none;border:none;color:var(--dim2);cursor:pointer;padding:12px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase}

.toast{position:absolute;left:20px;right:20px;bottom:96px;z-index:50;background:var(--teal);color:var(--ink);
  border-radius:11px;padding:11px 14px;font-size:12px;font-weight:600;opacity:0;transform:translateY(10px);
  transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}

.closing{position:absolute;inset:0;z-index:60;background:var(--ink);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px}
.closing.on{display:flex;animation:fade .25s both}
.closing .big{font-family:'Anton',sans-serif;font-size:26px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.closing .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim2);letter-spacing:.1em}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="phone">

  <header>
    <div class="eyebrow">
      <span>Sat · Night #14</span>
      <span class="live" id="liveTag"><span class="dot"></span>Open · 5h 30m</span>
    </div>
    <h1>Last Call</h1>
    <div class="totals">
      <div><div class="tot-lbl">Night total</div><div class="tot-big" id="hdrTotal">$0</div></div>
      <div><div class="tot-lbl">Your tab</div><div class="tot-sub" id="hdrYou">$0</div></div>
      <div><div class="tot-lbl">Out</div><div class="tot-sub" id="hdrOut">0</div></div>
    </div>
  </header>

  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="tonight">Tonight</button>
    <button role="tab" aria-selected="false" data-tab="crew">Crew</button>
    <button role="tab" aria-selected="false" data-tab="tab">The Tab</button>
  </nav>

  <main>
    <section class="pane on" id="pane-tonight"></section>
    <section class="pane" id="pane-crew"></section>
    <section class="pane" id="pane-tab"></section>
  </main>

  <div class="fab" id="fab">
    <button class="fab-main" id="btnRound">+ Round</button>
    <button class="fab-alt" id="btnOther" title="Log something else">$</button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="scrim" id="scrim"></div>

  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <h2 id="shTitle"></h2>
    <p class="hint" id="shHint"></p>

    <div class="section-lbl">Paid by</div>
    <div class="who" id="payerRow"></div>

    <div class="amount-display" id="amtDisp"></div>
    <div class="tip-row" id="tipRow">
      <button class="chip" data-tip="0">No tip</button>
      <button class="chip on" data-tip="18">18%</button>
      <button class="chip" data-tip="20">20%</button>
      <button class="chip" data-tip="25">25%</button>
      <button class="chip" data-tip="round">Round up</button>
    </div>

    <div class="pad" id="pad"></div>

    <div class="section-lbl">Splitting between</div>
    <div class="who" id="splitRow"></div>
    <div class="auto-note" id="autoNote"></div>
    <div class="who-actions">
      <button class="link" id="selPresent">Who's here</button>
      <button class="link" id="selAll">Everyone</button>
      <button class="link" id="selNone">Clear</button>
      <button class="link" id="tglShares">Uneven shares</button>
    </div>
    <div class="shares" id="sharesPanel" style="display:none"></div>

    <button class="confirm" id="confirmBtn"></button>
    <button class="danger" id="voidBtn" style="display:none">Void this expense</button>
    <button class="cancel" id="cancelBtn">Cancel</button>
  </div>

  <div class="closing" id="closing">
    <div class="big">Closing out</div>
    <div class="sub" id="closingSub">NETTING THE LEDGER…</div>
  </div>

</div>

<script>
/* ============================================================
   MODEL — night starts 8:00 PM; t = minutes since then
   ============================================================ */
const NIGHT_START = 20*60;         // 8:00 PM
let   NOW_T       = 330;           // 1:30 AM
const clock = t => {
  let m = (NIGHT_START + t) % (24*60);
  let h = Math.floor(m/60), mm = String(m%60).padStart(2,'0');
  const ap = h>=12 ? 'PM':'AM'; h = h%12 || 12;
  return `${h}:${mm} ${ap}`;
};

// joinedT / leftT define each person's presence window. leftT null = still out.
const people = [
  {id:'p1', name:'You',  short:'YO', color:'#E8A33D', joinedT:0,  leftT:null, dry:false},
  {id:'p2', name:'Dave', short:'DA', color:'#FF4D8D', joinedT:0,  leftT:null, dry:false},
  {id:'p3', name:'Sam',  short:'SA', color:'#3DD9B0', joinedT:0,  leftT:230,  dry:true },
  {id:'p4', name:'Nina', short:'NI', color:'#8B7BFF', joinedT:0,  leftT:null, dry:false},
  {id:'p5', name:'Tony', short:'TO', color:'#FF8A5B', joinedT:90, leftT:null, dry:false},
];

const stops = [
  {id:'s1', name:"The Anchor",   t:14},
  {id:'s2', name:"Marlowe's",    t:122},
  {id:'s3', name:"Pete's Slice", t:281},
];

// alloc: [{p, w}] — w is share weight. Even split = all weights 1.
let expenses = [
  {id:'e1', stopId:'s1', t:25,  payerId:'p1', base:41, tip:7,  note:'First round',   kind:'round', status:'confirmed', alloc:[{p:'p1',w:1},{p:'p2',w:1},{p:'p4',w:1}]},
  {id:'e2', stopId:'s1', t:70,  payerId:'p3', base:44, tip:8,  note:'Round 2 + wings',kind:'round',status:'confirmed', alloc:[{p:'p1',w:1},{p:'p2',w:1},{p:'p4',w:1}]},
  {id:'e3', stopId:'s1', t:98,  payerId:'p5', base:18, tip:3,  note:"Tony's catch-up",kind:'round',status:'confirmed', alloc:[{p:'p1',w:1},{p:'p2',w:1},{p:'p4',w:1},{p:'p5',w:1}]},
  {id:'e4', stopId:'s2', t:125, payerId:'p1', base:20, tip:0,  note:'Coat check + cash tip', kind:'other', status:'confirmed', alloc:[{p:'p1',w:1},{p:'p2',w:1},{p:'p3',w:1},{p:'p4',w:1},{p:'p5',w:1}]},
  {id:'e5', stopId:'s2', t:132, payerId:'p4', base:80, tip:16, note:'Cocktail round',kind:'round', status:'confirmed', alloc:[{p:'p1',w:1},{p:'p2',w:2},{p:'p4',w:1},{p:'p5',w:1}]},
  {id:'e6', stopId:'s2', t:205, payerId:'p5', base:52, tip:10, note:'Round 5',       kind:'round', status:'confirmed', alloc:[{p:'p1',w:1},{p:'p2',w:1},{p:'p4',w:1},{p:'p5',w:1}]},
  {id:'e7', stopId:'s3', t:290, payerId:'p1', base:34, tip:7,  note:'Pizza for the table', kind:'food', status:'confirmed', alloc:[{p:'p1',w:1},{p:'p2',w:1},{p:'p4',w:1},{p:'p5',w:1}]},
  {id:'e8', stopId:'s3', t:322, payerId:'p2', base:28.40,tip:0,note:'Uber home',     kind:'other', status:'pending',   alloc:[{p:'p1',w:1},{p:'p2',w:1},{p:'p4',w:1}]},
];

let nightClosed = false;
let settled = new Set();

const byId  = id => people.find(p=>p.id===id);
const total = e => e.base + e.tip;
const money = n => '$' + n.toFixed(2);
const money0= n => '$' + Math.round(n).toLocaleString();
const sumW  = e => e.alloc.reduce((s,a)=>s+a.w,0);

/* presence */
const presentAt = (p,t) => t >= p.joinedT && (p.leftT===null || t < p.leftT);
function eligible(kind, t){
  return people.filter(p => presentAt(p,t) && !(kind==='round' && p.dry)).map(p=>p.id);
}

/* ============================================================
   DERIVED LEDGER
   ============================================================ */
function ledger(){
  const paid={}, owed={};
  people.forEach(p=>{paid[p.id]=0; owed[p.id]=0});
  expenses.filter(e=>e.status!=='disputed').forEach(e=>{
    const t=total(e), W=sumW(e);
    paid[e.payerId]+=t;
    e.alloc.forEach(a=> owed[a.p] += t*a.w/W);
  });
  const net={}; people.forEach(p=> net[p.id]=paid[p.id]-owed[p.id]);
  return {paid,owed,net};
}

/* greedy debt minimisation */
function settle(net){
  const cr=[], db=[];
  Object.entries(net).forEach(([id,a])=>{
    if(a> 0.005) cr.push({id,amt:a});
    if(a<-0.005) db.push({id,amt:-a});
  });
  cr.sort((a,b)=>b.amt-a.amt); db.sort((a,b)=>b.amt-a.amt);
  const out=[]; let i=0,j=0;
  while(i<db.length && j<cr.length){
    const amt=Math.min(db[i].amt,cr[j].amt);
    out.push({from:db[i].id,to:cr[j].id,amt});
    db[i].amt-=amt; cr[j].amt-=amt;
    if(db[i].amt<0.005)i++; if(cr[j].amt<0.005)j++;
  }
  return out;
}
const naiveCount = () => expenses.filter(e=>e.status!=='disputed')
  .reduce((n,e)=>n+e.alloc.filter(a=>a.p!==e.payerId).length,0);

/* ============================================================
   RENDER
   ============================================================ */
const $ = s=>document.querySelector(s);
const avatar = p => `<div class="av" style="background:${p.color}">${p.short}</div>`;

function renderHeader(){
  const l=ledger();
  const g=expenses.filter(e=>e.status!=='disputed').reduce((s,e)=>s+total(e),0);
  $('#hdrTotal').textContent=money0(g);
  $('#hdrYou').textContent=money0(l.owed.p1);
  $('#hdrOut').textContent=people.filter(p=>presentAt(p,NOW_T)).length + '/' + people.length;
  $('#liveTag').className = 'live' + (nightClosed?' closed':'');
  $('#liveTag').innerHTML = `<span class="dot"></span>${nightClosed?'Closed · tab settled':'Open · 5h 30m'}`;
}

function renderTonight(){
  const el=$('#pane-tonight');

  // interleave expenses and presence changes, in time order
  const events=[];
  expenses.forEach(e=>events.push({t:e.t, type:'exp', e}));
  people.forEach(p=>{
    if(p.joinedT>0) events.push({t:p.joinedT, type:'in', p});
    if(p.leftT!==null) events.push({t:p.leftT, type:'out', p});
  });

  el.innerHTML = stops.map((s,i)=>{
    const next = stops[i+1] ? stops[i+1].t : Infinity;
    const mine = events.filter(v=>v.t>=s.t && v.t<next).sort((a,b)=>a.t-b.t);
    if(!mine.length) return '';
    const sub = mine.filter(v=>v.type==='exp'&&v.e.status!=='disputed').reduce((a,v)=>a+total(v.e),0);
    return `<div class="stop">
      <div class="stop-head">
        <div class="stop-idx">${i+1}</div>
        <div class="stop-name">${s.name}</div>
        <div class="stop-time">${clock(s.t)} · ${money0(sub)}</div>
      </div>
      ${mine.map(v=>{
        if(v.type!=='exp'){
          return `<div class="tapline ${v.type}"><span class="bar"></span>
            ${v.p.name} ${v.type==='in'?'tapped in':'tapped out'} · ${clock(v.t)}
            <span class="bar"></span></div>`;
        }
        const e=v.e, p=byId(e.payerId), W=sumW(e);
        const uneven = e.alloc.some(a=>a.w!==1);
        return `<div class="exp ${e.status}" data-edit="${e.id}">
          ${avatar(p)}
          <div class="exp-mid">
            <div class="exp-note">${e.note}</div>
            <div class="exp-meta">${p.name} paid${e.tip?` · ${money(e.tip)} tip`:''}${e.status==='disputed'?' · FLAGGED':''}</div>
            ${e.status==='pending'?`<div class="pending-bar"><div class="pending-fill"></div></div>`:''}
          </div>
          <div>
            <div class="exp-amt">${money(total(e))}</div>
            <div class="exp-split">${uneven?`${W} shares`:`${e.alloc.length}-way`} · ${money(total(e)/W)}${uneven?'/sh':''}</div>
          </div>
          <button class="flag ${e.status==='disputed'?'on':''}" data-flag="${e.id}" aria-label="Flag">⚑</button>
        </div>`;
      }).join('')}
    </div>`;
  }).join('') + (nightClosed ? '' :
    `<button class="lastcall" id="btnLastCall">Last Call
      <small>CLOSE THE NIGHT · PRINT THE TAB</small></button>`);

  el.querySelectorAll('[data-flag]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const e=expenses.find(x=>x.id===b.dataset.flag);
    e.status = e.status==='disputed'?'confirmed':'disputed';
    toast(e.status==='disputed'?'Flagged — held out of the tab':'Unflagged — back in the ledger');
    renderAll();
  });
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));
  const lc=$('#btnLastCall'); if(lc) lc.onclick=doLastCall;
}

function renderCrew(){
  const l=ledger(), span=NOW_T||1;
  $('#pane-crew').innerHTML =
    `<div class="note-box"><b style="color:var(--paper)">Presence drives the split.</b><br>
      Tap someone out when they leave and every expense logged after that
      skips them automatically. No need to untick a name seven times.</div>` +
    `<div class="section-lbl">Who was out · 8:00 PM → ${clock(NOW_T)}</div>` +
    people.map(p=>{
      const start=(p.joinedT/span)*100, end=((p.leftT===null?span:p.leftT)/span)*100;
      const here=presentAt(p,NOW_T);
      return `<div class="prow">
        <div class="ptop">
          ${avatar(p)}
          <div class="pname">${p.name}
            ${p.dry?'<span class="ptag tag-dry">Not drinking</span>':''}
            ${!here?'<span class="ptag tag-gone">Gone</span>':''}</div>
          <div style="min-width:84px">
            <div class="pspend">${money(l.owed[p.id])}</div>
            <div class="pnet ${l.net[p.id]>=0?'pos':'neg'}">${l.net[p.id]>=0?'is owed ':'owes '}${money(Math.abs(l.net[p.id]))}</div>
          </div>
        </div>
        <div class="track"><div class="span" style="left:${start}%;width:${Math.max(end-start,2)}%;background:${p.color}"></div></div>
        <div class="pmeta">
          <span>IN ${clock(p.joinedT)}</span>
          <span>${p.leftT===null?'STILL OUT':'OUT '+clock(p.leftT)}</span>
        </div>
        <div class="pbtns">
          <button class="mini-btn warn ${!here?'on':''}" data-tap="${p.id}">${here?'Tap out':'Tap back in'}</button>
          <button class="mini-btn ${p.dry?'on':''}" data-dry="${p.id}">Not drinking</button>
        </div>
      </div>`;
    }).join('');

  document.querySelectorAll('[data-tap]').forEach(b=>b.onclick=()=>{
    const p=byId(b.dataset.tap);
    if(presentAt(p,NOW_T)){ p.leftT=NOW_T; toast(`${p.name} tapped out — off all new expenses`); }
    else { p.leftT=null; p.joinedT=Math.min(p.joinedT,NOW_T); toast(`${p.name} is back in`); }
    renderAll();
  });
  document.querySelectorAll('[data-dry]').forEach(b=>b.onclick=()=>{
    const p=byId(b.dataset.dry); p.dry=!p.dry;
    toast(p.dry?`${p.name} is off drink rounds — still splits food`:`${p.name} is back in on rounds`);
    renderAll();
  });
}

function renderTab(){
  const l=ledger(), pays=settle(l.net);
  const live=expenses.filter(e=>e.status!=='disputed');
  const g=live.reduce((s,e)=>s+total(e),0), tips=live.reduce((s,e)=>s+e.tip,0);
  const flagged=expenses.filter(e=>e.status==='disputed');

  $('#pane-tab').innerHTML =
    (nightClosed?'':`<div class="preview-tag">PREVIEW · NIGHT STILL OPEN<br>
      These numbers move as people log rounds. Hit <b>Last Call</b> to close and lock the tab.</div>`) +
    `<div class="receipt">
      <div class="r-center">
        <div class="r-title">LAST CALL</div>
        <div class="r-muted">${nightClosed?'TAB CLOSED':'RUNNING TAB'} · NIGHT #14</div>
        <div class="r-muted">${stops.map(s=>s.name).join(' → ')}</div>
      </div>
      <div class="r-rule"></div>
      <div class="r-line"><span>Subtotal</span><span>${money(g-tips)}</span></div>
      <div class="r-line"><span>Tips</span><span>${money(tips)}</span></div>
      <div class="r-line"><b>NIGHT TOTAL</b><b>${money(g)}</b></div>
      <div class="r-rule"></div>
      <div class="r-center r-big">WHO PAYS WHO</div>
      <div class="r-center r-muted" style="margin-bottom:8px">${naiveCount()} debts → ${pays.length} payment${pays.length===1?'':'s'}</div>
      ${pays.length ? pays.map((p,i)=>`
        <div class="r-pay ${settled.has(i)?'settled':''}" style="animation-delay:${i*.08}s">
          <span><b>${byId(p.from).name}</b> → ${byId(p.to).name}</span><b>${money(p.amt)}</b></div>
        ${settled.has(i)?'':`<button class="venmo" data-pay="${i}">Request in Venmo</button>`}`).join('')
        : `<div class="r-center r-muted" style="padding:14px 0">All square.</div>`}
      ${flagged.length?`<div class="r-rule"></div>
        <div class="r-muted r-center">⚑ ${flagged.length} item${flagged.length===1?'':'s'} flagged &amp; excluded</div>
        ${flagged.map(e=>`<div class="r-line r-muted"><span>${e.note}</span><span>${money(total(e))}</span></div>`).join('')}`:''}
      <div class="r-rule"></div>
      <div class="r-stat"><span>Rounds bought</span><span>${expenses.filter(e=>e.kind==='round').length}</span></div>
      <div class="r-stat"><span>Longest night</span><span>${longest()}</span></div>
      <div class="r-stat"><span>Most generous</span><span>${extreme(l,1)}</span></div>
      <div class="r-stat"><span>Cheapest date</span><span>${extreme(l,-1)}</span></div>
      <div class="r-rule"></div>
      <div class="r-center r-muted">*** THAT'S LAST CALL, FOLKS ***</div>
    </div>`;

  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{
    settled.add(+b.dataset.pay); toast('Marked settled — we never move the money'); renderTab();
  });
}
function extreme(l,dir){
  const p=[...people].sort((a,b)=>dir*(l.paid[b.id]-l.paid[a.id]))[0];
  return `${p.name} (${money0(l.paid[p.id])})`;
}
function longest(){
  const p=[...people].sort((a,b)=>((b.leftT??NOW_T)-b.joinedT)-((a.leftT??NOW_T)-a.joinedT))[0];
  const m=(p.leftT??NOW_T)-p.joinedT;
  return `${p.name} (${Math.floor(m/60)}h ${m%60}m)`;
}
function renderAll(){renderHeader();renderTonight();renderCrew();renderTab()}

/* ---------- tabs ---------- */
function goTab(name){
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected', x.dataset.tab===name));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on', p.id==='pane-'+name));
  $('#fab').style.display = (name==='tab'||nightClosed) ? 'none':'flex';
  if(name==='tab') renderTab();
  $('main').scrollTop=0;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>goTab(b.dataset.tab));

/* ---------- last call ---------- */
function doLastCall(){
  expenses.forEach(e=>{ if(e.status==='pending') e.status='confirmed'; });
  $('#closing').classList.add('on');
  setTimeout(()=>$('#closingSub').textContent='COLLAPSING '+naiveCount()+' DEBTS…',700);
  setTimeout(()=>{
    nightClosed=true; $('#closing').classList.remove('on');
    renderAll(); goTab('tab');
    toast('Tab closed. Nothing else can be added.');
  },1700);
}

/* ============================================================
   SHEET — add + edit share the same UI
   ============================================================ */
let draft=null;

function baseOf(){ return draft.editing ? draft.base : (parseInt(draft.digits||'0',10))/100; }
function tipOf(){
  const b=baseOf();
  if(draft.tip==='round') return Math.ceil((b||0)/5)*5 - b;
  return b*(draft.tip/100);
}
const totOf = ()=> baseOf()+tipOf();
const wSum  = ()=> draft.alloc.reduce((s,a)=>s+a.w,0);

function openAdd(kind){
  const t=NOW_T;
  draft={editing:null, kind, payer:'p1', digits:'', tip:kind==='round'?18:0, showShares:false,
         alloc: eligible(kind,t).map(p=>({p,w:1})), t};
  $('#shTitle').textContent = kind==='round' ? "Who's buying?" : 'Log an expense';
  $('#shHint').textContent  = kind==='round'
    ? 'Split defaults to whoever is out right now, minus anyone not drinking.'
    : "Cover, cab, coat check, cash tip — anything that isn't a round.";
  $('#pad').parentElement.querySelector('#pad').style.display='grid';
  $('#voidBtn').style.display='none';
  showSheet();
}
function openEdit(id){
  if(nightClosed){ toast('Tab is closed — reopen the night to edit'); return; }
  const e=expenses.find(x=>x.id===id);
  draft={editing:id, kind:e.kind, payer:e.payerId, base:e.base, tip:0, showShares:e.alloc.some(a=>a.w!==1),
         alloc:e.alloc.map(a=>({...a})), t:e.t, fixedTip:e.tip};
  $('#shTitle').textContent='Edit expense';
  $('#shHint').textContent=`${e.note} · logged ${clock(e.t)}. Drop someone out or give them a bigger share — the ledger recalculates.`;
  $('#pad').style.display='none';
  $('#voidBtn').style.display='block';
  showSheet();
}
function showSheet(){ renderSheet(); $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); }
function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); }

function renderSheet(){
  const t=draft.t;
  $('#payerRow').innerHTML=people.map(p=>`
    <button class="${draft.payer===p.id?'on':''} ${presentAt(p,t)?'':'away'}" data-payer="${p.id}">
      <span class="mini" style="background:${p.color}">${p.short}</span>${p.name}</button>`).join('');
  $('#payerRow').querySelectorAll('[data-payer]').forEach(b=>b.onclick=()=>{draft.payer=b.dataset.payer;renderSheet()});

  const tot = draft.editing ? draft.base+draft.fixedTip : totOf();
  const W = wSum()||1;
  $('#amtDisp').innerHTML = tot
    ? `${money(tot)}<span style="font-size:12px;color:var(--dim2);display:block;margin-top:2px">
        ${draft.editing?`${money(draft.base)} + ${money(draft.fixedTip)} tip`:`${money(baseOf())} + ${money(tipOf())} tip`}
        ${draft.alloc.length?` · ${money(tot/W)}/share`:''}</span>`
    : `$0.00<span style="font-size:12px;color:var(--dim2);display:block;margin-top:2px">tap the keypad</span>`;

  $('#tipRow').style.display = draft.editing ? 'none':'flex';
  $('#tipRow').querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('on', String(draft.tip)===c.dataset.tip);
    c.onclick=()=>{draft.tip = c.dataset.tip==='round'?'round':+c.dataset.tip; renderSheet()};
  });

  const inSplit = id => draft.alloc.some(a=>a.p===id);
  $('#splitRow').innerHTML=people.map(p=>`
    <button class="${inSplit(p.id)?'on':''} ${presentAt(p,t)?'':'away'}" data-split="${p.id}">
      <span class="mini" style="background:${p.color}">${p.short}</span>${p.name}${presentAt(p,t)?'':' ·gone'}</button>`).join('');
  $('#splitRow').querySelectorAll('[data-split]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.split;
    draft.alloc = inSplit(id) ? draft.alloc.filter(a=>a.p!==id) : [...draft.alloc,{p:id,w:1}];
    renderSheet();
  });

  const absent=people.filter(p=>!presentAt(p,t));
  const dry=people.filter(p=>p.dry && presentAt(p,t));
  const bits=[];
  if(absent.length) bits.push(`${absent.map(p=>p.name).join(', ')} ${absent.length>1?'were':'was'} not here — excluded automatically.`);
  if(dry.length && draft.kind==='round') bits.push(`${dry.map(p=>p.name).join(', ')} not drinking — off this round.`);
  $('#autoNote').textContent = bits.join(' ');

  $('#tglShares').textContent = draft.showShares ? 'Even split' : 'Uneven shares';
  const sp=$('#sharesPanel');
  sp.style.display = draft.showShares ? 'block':'none';
  if(draft.showShares){
    sp.innerHTML = draft.alloc.map(a=>{
      const p=byId(a.p);
      return `<div class="shrow">
        <span class="mini" style="background:${p.color};width:20px;height:20px;border-radius:50%;
          display:grid;place-items:center;font-family:'IBM Plex Mono';font-size:8px;color:var(--ink);font-weight:600">${p.short}</span>
        <span class="nm">${p.name}</span>
        <span class="stepper">
          <button data-w="${a.p}" data-d="-1">−</button><span>${a.w}×</span><button data-w="${a.p}" data-d="1">+</button>
        </span>
        <span class="amt">${money(tot*a.w/W)}</span></div>`;
    }).join('') || `<div style="font-size:11px;color:var(--dim2);padding:4px 0">Nobody on this expense yet.</div>`;
    sp.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{
      const a=draft.alloc.find(x=>x.p===b.dataset.w);
      a.w=Math.max(1,Math.min(6,a.w+(+b.dataset.d)));
      renderSheet();
    });
  }

  const ok = draft.alloc.length>0 && (draft.editing || baseOf()>0);
  $('#confirmBtn').disabled=!ok;
  $('#confirmBtn').textContent = !draft.alloc.length ? "Pick who it's for"
    : draft.editing ? `Save · ${draft.alloc.length} on it` : `Log ${money(totOf())} · ${draft.alloc.length}-way`;
}

$('#pad').innerHTML=['1','2','3','4','5','6','7','8','9','·','0','⌫']
  .map(k=>`<button data-k="${k}">${k}</button>`).join('');
$('#pad').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;
  if(k==='⌫') draft.digits=draft.digits.slice(0,-1);
  else if(k==='·') draft.digits+='00';
  else if(draft.digits.length<7) draft.digits+=k;
  renderSheet();
});

$('#selPresent').onclick=()=>{draft.alloc=eligible(draft.kind,draft.t).map(p=>({p,w:1}));renderSheet()};
$('#selAll').onclick    =()=>{draft.alloc=people.map(p=>({p:p.id,w:1}));renderSheet()};
$('#selNone').onclick   =()=>{draft.alloc=[];renderSheet()};
$('#tglShares').onclick =()=>{
  if(draft.showShares) draft.alloc.forEach(a=>a.w=1);
  draft.showShares=!draft.showShares; renderSheet();
};

$('#btnRound').onclick=()=>openAdd('round');
$('#btnOther').onclick=()=>openAdd('other');
$('#cancelBtn').onclick=closeSheet;
$('#scrim').onclick=closeSheet;

$('#voidBtn').onclick=()=>{
  expenses=expenses.filter(e=>e.id!==draft.editing);
  closeSheet(); renderAll(); toast('Voided — removed from the tab');
};

$('#confirmBtn').onclick=()=>{
  if(draft.editing){
    const e=expenses.find(x=>x.id===draft.editing);
    e.payerId=draft.payer; e.alloc=draft.alloc.map(a=>({...a}));
    closeSheet(); renderAll(); toast('Updated — balances recalculated');
    return;
  }
  const n=expenses.filter(e=>e.kind==='round').length+1;
  const e={id:'e'+(expenses.length+1), stopId:stops[stops.length-1].id, t:NOW_T,
    payerId:draft.payer, base:baseOf(), tip:tipOf(),
    note: draft.kind==='round'?`Round ${n}`:'Expense',
    kind:draft.kind, status:'pending', alloc:draft.alloc.map(a=>({...a}))};
  expenses.push(e);
  NOW_T += 4;
  setTimeout(()=>{ if(e.status==='pending'){e.status='confirmed'; renderAll();} },12000);
  closeSheet(); renderAll();
  toast(`Logged · ${money(total(e))} across ${e.alloc.length}`);
};

let tT; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2700)}

renderAll();
</script>
