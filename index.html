<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120D1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<title>Last Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

</head>
<body>
<div class="phone">
  <header id="siteHeader">
    <span class="ht-mark" aria-hidden="true" id="htMark"></span>
    <div class="ht-name-block">
      <span class="ht-name" id="htName">—</span>
      <span class="ht-status" id="htStatus"></span>
    </div>
    <span class="ht-total" id="htTotal">$0.00</span>
    <span class="ht-live" id="htLive"><span class="dot"></span>Live</span>
    <button class="ht-menu-btn" id="htMenuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Night options">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/>
      </svg>
    </button>
  </header>
  <div class="ht-menu" id="htMenu" role="menu" aria-label="Night options" style="display:none">
    <button class="ht-menu-item" id="htGuide" role="menuitem">How this works</button>
    <button class="ht-menu-item" id="htSwitchNight" role="menuitem">Switch night</button>
    <button class="ht-menu-item danger" id="htLeaveNight" role="menuitem" style="display:none">Leave this night entirely</button>
    <button class="ht-menu-item danger" id="htCloseNight" role="menuitem" style="display:none">Close the night</button>
  </div>

  <nav role="tablist">
    <button role="tab" id="tab-tonight" aria-selected="true" aria-controls="pane-tonight" data-tab="tonight">Tonight</button>
    <button role="tab" id="tab-crew" aria-selected="false" aria-controls="pane-crew" data-tab="crew">Crew</button>
    <button role="tab" id="tab-tab" aria-selected="false" aria-controls="pane-tab" data-tab="tab">The Tab</button>
  </nav>

  <main>
    <section class="pane on" id="pane-tonight" role="tabpanel" aria-labelledby="tab-tonight"></section>
    <section class="pane" id="pane-crew" role="tabpanel" aria-labelledby="tab-crew"></section>
    <section class="pane" id="pane-tab" role="tabpanel" aria-labelledby="tab-tab"></section>
  </main>

  <div class="fab" id="fab" style="display:none">
    <button class="fab-main" id="btnRound">+ Add Round</button>
    <button class="fab-alt" id="btnStop"><span class="ico" aria-hidden="true">📍</span>Add Stop</button>
    <button class="fab-last" id="btnLastCallFab">Last Call</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="scrim" id="scrim"></div>

  <div class="sheet sheet-full" id="sheet">
    <div class="sheet-topbar">
      <h2 id="shTitle"></h2>
      <button class="sheet-close" id="sheetCloseBtn" aria-label="Close">×</button>
    </div>
    <div class="sheet-scroll">
      <p class="hint" id="shHint" style="display:none"></p>

      <div class="row-combo">
        <span class="field-label" style="max-width:none;margin:0">Paid by</span>
        <button class="payer-pill" id="payerPill" type="button" aria-expanded="false" style="margin-left:-4px;margin-right:auto">
          <span class="mini" id="payerPillAvatar"></span>
          <span id="payerPillName"></span>
          <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="kind-switch-compact" id="toggleKind" type="button"></button>
      </div>
      <div class="who" id="payerRow" style="display:none"></div>

      <div class="amount-display" id="amtDisp" aria-live="polite"></div>
      <div class="tip-row" id="tipRow">
        <button class="chip" data-tip="18">18%</button>
        <button class="chip" data-tip="20">20%</button>
        <button class="chip" id="tipCustomBtn" type="button">Custom</button>
      </div>
      <input type="number" inputmode="decimal" id="tipCustomInput" class="tip-custom-input"
        placeholder="Custom tip %" style="display:none">
      <div class="pad" id="pad"></div>

      <button class="split-summary-row" id="splitSummaryRow" type="button">
        <div class="split-summary-main">
          <span id="splitSummaryHeadline"></span>
          <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </div>
        <div class="split-summary-names" id="splitSummaryNames"></div>
      </button>
      <div class="split-warning" id="splitWarning" aria-live="polite" style="display:none"></div>

      <button class="details-row" id="detailsRow" type="button">
        <svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>
        <span class="details-row-label" id="detailsRowLabel">Add note or receipt</span>
        <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <div class="sheet-footer">
      <button class="confirm" id="confirmBtn"></button>
      <button class="danger" id="voidBtn" style="display:none">Void this expense</button>
      <button class="cancel" id="cancelBtn">Cancel</button>
    </div>
  </div>

  <!-- Edit Split — child sheet. Reuses the exact same draft.alloc /
       eligible() / uneven-share logic as before; only the container
       moved. Mutations are still immediate (tapping a person toggles
       them right away, same as pre-restructure) — "Apply Split" just
       closes the sheet, it doesn't commit anything that wasn't already
       committed, since immediate mutation was already the existing,
       safe behavior. -->
  <div class="sheet sheet-full z2" id="editSplitSheet">
    <div class="sheet-topbar">
      <h2>Edit Split</h2>
      <button class="sheet-close" id="editSplitCloseBtn" aria-label="Close">×</button>
    </div>
    <div class="sheet-scroll">
      <div class="split-selected-summary" id="editSplitSummary"></div>
      <div class="who" id="editSplitRow"></div>
      <div class="auto-note" id="editSplitAutoNote"></div>
      <div class="who-actions">
        <button class="link" id="selCurrentCrew">Current Crew</button>
        <button class="link" id="selAll">Everyone</button>
        <button class="link quiet" id="selNone">Clear</button>
      </div>
      <button class="link" id="tglShares" style="display:block;margin-top:8px">Uneven shares</button>
      <div class="shares" id="sharesPanel" style="display:none;margin-top:10px"></div>
    </div>
    <div class="sheet-footer">
      <button class="confirm" id="applySplitBtn">Apply Split</button>
    </div>
  </div>

  <!-- Round Details — child sheet combining Note + Receipt. Same
       draft.description / draft.receiptUrl state as before; "Save
       Details" just closes, same reasoning as Apply Split above. -->
  <div class="sheet sheet-full z2" id="detailsSheet">
    <div class="sheet-topbar">
      <h2>Round Details</h2>
      <button class="sheet-close" id="detailsCloseBtn" aria-label="Close">×</button>
    </div>
    <div class="sheet-scroll">
      <label class="field-label" for="expDesc" style="max-width:none;margin:0 0 6px">Note</label>
      <input id="expDesc" class="desc-field" placeholder="e.g. Margaritas at Marlowe's" maxlength="80">

      <div class="section-lbl">Receipt</div>
      <input type="file" id="receiptFile" accept="image/*,application/pdf" style="display:none">
      <button class="receipt-attach-btn" id="receiptAttachBtn" type="button" style="margin-top:8px"></button>
      <button class="link" id="receiptRemoveBtn" style="display:none;margin-top:8px">Remove receipt</button>
      <p class="split-warning error" id="receiptError" role="alert" style="display:none;margin-top:8px"></p>
    </div>
    <div class="sheet-footer">
      <button class="confirm" id="saveDetailsBtn">Save Details</button>
    </div>
  </div>

  <div class="sheet sheet-compact" id="stopSheet">
    <div class="sheet-handle">
      <div class="grab"></div>
      <h2>We moved</h2>
      <p class="hint">Name it if you know it — you can rename later. Leave it blank and it'll just be "Stop N".</p>
    </div>
    <input id="stopName" aria-label="Stop name" placeholder="e.g. Marlowe's" maxlength="60"
      style="width:100%;background:var(--ink3);border:1px solid var(--line);border-radius:10px;
        padding:12px;color:var(--paper);font-family:'Archivo';font-size:16px;margin-bottom:14px">
    <button class="confirm" id="stopGo">Log the move</button>
    <button class="cancel" id="stopCancel">Cancel</button>
  </div>

  <div class="sheet sheet-compact" id="lastCallSheet">
    <div class="sheet-handle">
      <div class="grab"></div>
      <h2>Last Call?</h2>
      <p class="hint">This closes the night and prepares the final tab.</p>
    </div>
    <div class="lc-summary" id="lcSummary"></div>
    <button class="keep-btn" id="lcKeepBtn">Keep Night Open</button>
    <button class="end-btn" id="lcEndBtn">End Night</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="big" id="ovTitle">Connecting</div>
    <div class="sub" id="ovSub">Signing you in…</div>
    <div id="ovBody"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
